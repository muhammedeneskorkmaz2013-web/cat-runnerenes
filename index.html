<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kitchen Chase - 3D Endless Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .ui {
            position: absolute;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #score {
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-weight: bold;
        }
        #highScore {
            top: 60px;
            left: 20px;
            font-size: 18px;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
        }
        .subtitle {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        button {
            padding: 15px 40px;
            font-size: 24px;
            font-family: inherit;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:hover {
            transform: scale(1.1);
        }
        button:active {
            transform: scale(0.95);
        }
        .controls {
            margin-top: 30px;
            font-size: 16px;
            opacity: 0.8;
            text-align: center;
        }
        #finalScore {
            font-size: 36px;
            margin: 20px 0;
        }
        #speedDisplay {
            top: 100px;
            left: 20px;
            font-size: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="score" class="ui">Score: 0</div>
    <div id="highScore" class="ui">High Score: 0</div>
    <div id="speedDisplay" class="ui">Speed: 1.0x</div>

    <div id="startScreen">
        <h1>🧀 KITCHEN CHASE 🐱</h1>
        <div class="subtitle">Help the mouse escape from the cat!</div>
        <button id="startBtn">START GAME</button>
        <div class="controls">
            <strong>Desktop:</strong> SPACE = Jump | S = Slide | A/D = Move<br>
            <strong>Mobile:</strong> Swipe Up/Down/Left/Right
        </div>
    </div>

    <div id="gameOverScreen" class="hidden">
        <h1>GAME OVER!</h1>
        <div id="finalScore">Score: 0</div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game State
        let scene, camera, renderer;
        let player, floor, obstacles = [], cheeses = [];
        let gameState = 'start'; // start, playing, gameover
        let score = 0, highScore = 0;
        let gameSpeed = 1;
        let playerLane = 1; // 0=left, 1=center, 2=right
        let isJumping = false, isSliding = false;
        let jumpVelocity = 0;
        let obstacleSpawnTimer = 0;
        let cheeseSpawnTimer = 0;
        let floorSegments = [];
        let cat;

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Load high score
        highScore = parseInt(localStorage.getItem('kitchenChaseHighScore') || '0');
        document.getElementById('highScore').textContent = `High Score: ${highScore}`;

        // Initialize Three.js
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 8);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Create floor segments (endless)
            createFloor();

            // Create player (mouse)
            createPlayer();

            // Create cat chaser
            createCat();

            // Event listeners
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createFloor() {
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xF5DEB3,
                roughness: 0.8
            });

            for (let i = 0; i < 6; i++) {
                const segment = new THREE.Mesh(floorGeometry, floorMaterial);
                segment.rotation.x = -Math.PI / 2;
                segment.position.z = -i * 10;
                segment.receiveShadow = true;
                
                // Add kitchen tile pattern
                const lines = new THREE.Group();
                for (let x = -4; x <= 4; x += 2) {
                    const lineGeo = new THREE.BoxGeometry(0.05, 0.01, 10);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0xD2B48C });
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.position.set(x, 0.01, 0);
                    line.rotation.x = -Math.PI / 2;
                    lines.add(line);
                }
                segment.add(lines);

                scene.add(segment);
                floorSegments.push(segment);
            }
        }

        function createPlayer() {
            const group = new THREE.Group();
            
            // Mouse body
            const bodyGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);

            // Ears
            const earGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const earMat = new THREE.MeshStandardMaterial({ color: 0xFFB6C1 });
            const leftEar = new THREE.Mesh(earGeo, earMat);
            leftEar.position.set(-0.25, 0.3, 0.1);
            const rightEar = new THREE.Mesh(earGeo, earMat);
            rightEar.position.set(0.25, 0.3, 0.1);
            group.add(leftEar, rightEar);

            // Nose
            const noseGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const noseMat = new THREE.MeshStandardMaterial({ color: 0xFF69B4 });
            const nose = new THREE.Mesh(noseGeo, noseMat);
            nose.position.set(0, 0, 0.4);
            group.add(nose);

            // Tail
            const tailGeo = new THREE.CylinderGeometry(0.05, 0.02, 0.8);
            const tailMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const tail = new THREE.Mesh(tailGeo, tailMat);
            tail.position.set(0, 0, -0.5);
            tail.rotation.x = Math.PI / 4;
            group.add(tail);

            group.position.set(0, 0.5, 2);
            scene.add(group);
            player = group;
        }

        function createCat() {
            const group = new THREE.Group();
            
            // Cat body
            const bodyGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFF8C00 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            group.add(body);

            // Ears (triangular)
            const earGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
            const earMat = new THREE.MeshStandardMaterial({ color: 0xFF8C00 });
            const leftEar = new THREE.Mesh(earGeo, earMat);
            leftEar.position.set(-0.3, 0.5, 0);
            const rightEar = new THREE.Mesh(earGeo, earMat);
            rightEar.position.set(0.3, 0.5, 0);
            group.add(leftEar, rightEar);

            group.position.set(0, 0.6, 8);
            scene.add(group);
            cat = group;
        }

        function createObstacle(lane, z) {
            const types = ['table', 'chair', 'puddle'];
            const type = types[Math.floor(Math.random() * types.length)];
            let obstacle;

            if (type === 'table') {
                const legGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
                const legMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                obstacle = new THREE.Group();
                
                for (let i = 0; i < 4; i++) {
                    const leg = new THREE.Mesh(legGeo, legMat);
                    leg.castShadow = true;
                    leg.position.set(i % 2 === 0 ? -0.3 : 0.3, 0.5, i < 2 ? -0.3 : 0.3);
                    obstacle.add(leg);
                }

                const topGeo = new THREE.BoxGeometry(0.8, 0.1, 0.8);
                const top = new THREE.Mesh(topGeo, legMat);
                top.position.y = 1;
                top.castShadow = true;
                obstacle.add(top);
            } else if (type === 'chair') {
                const geo = new THREE.BoxGeometry(0.6, 1.2, 0.6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x654321 });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.castShadow = true;
            } else {
                const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0xFFFFFF,
                    transparent: true,
                    opacity: 0.7
                });
                obstacle = new THREE.Mesh(geo, mat);
                obstacle.rotation.x = Math.PI / 2;
            }

            const x = (lane - 1) * 3;
            obstacle.position.set(x, type === 'puddle' ? 0.05 : 0.6, z);
            obstacle.userData.type = type;
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createCheese(lane, z) {
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshStandardMaterial({ color: 0xFFFF00, emissive: 0xFFFF00, emissiveIntensity: 0.3 });
            const cheese = new THREE.Mesh(geo, mat);
            cheese.castShadow = true;
            
            const x = (lane - 1) * 3;
            cheese.position.set(x, 0.3, z);
            cheese.rotation.set(Math.random(), Math.random(), Math.random());
            
            scene.add(cheese);
            cheeses.push(cheese);
        }

        function setupControls() {
            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (gameState !== 'playing') return;
                
                if (e.code === 'Space' && !isJumping && !isSliding) {
                    jump();
                } else if (e.code === 'KeyS' && !isJumping && !isSliding) {
                    slide();
                } else if (e.code === 'KeyA') {
                    moveLane(-1);
                } else if (e.code === 'KeyD') {
                    moveLane(1);
                }
            });

            // Touch controls
            let touchStartX = 0, touchStartY = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            document.addEventListener('touchend', (e) => {
                if (gameState !== 'playing') return;
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 50) moveLane(1);
                    else if (dx < -50) moveLane(-1);
                } else {
                    if (dy < -50 && !isJumping && !isSliding) jump();
                    else if (dy > 50 && !isJumping && !isSliding) slide();
                }
            });

            // Start button
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', restartGame);
        }

        function jump() {
            isJumping = true;
            jumpVelocity = 0.25;
            playSound(600, 0.1);
        }

        function slide() {
            isSliding = true;
            player.scale.y = 0.5;
            playSound(200, 0.1);
            setTimeout(() => {
                isSliding = false;
                player.scale.y = 1;
            }, 500);
        }

        function moveLane(direction) {
            playerLane = Math.max(0, Math.min(2, playerLane + direction));
            playSound(400, 0.05);
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            gameSpeed = 1;
            obstacles.forEach(o => scene.remove(o));
            cheeses.forEach(c => scene.remove(c));
            obstacles = [];
            cheeses = [];
            playerLane = 1;
            isJumping = false;
            isSliding = false;
            player.position.set(0, 0.5, 2);
            
            document.getElementById('startScreen').classList.add('hidden');
            updateScore();
            animate();
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }

        function gameOver() {
            gameState = 'gameover';
            playSound(100, 0.3);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('kitchenChaseHighScore', highScore);
                document.getElementById('highScore').textContent = `High Score: ${highScore}`;
            }

            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function updateScore() {
            document.getElementById('score').textContent = `Score: ${score}`;
            document.getElementById('speedDisplay').textContent = `Speed: ${gameSpeed.toFixed(1)}x`;
        }

        function checkCollision() {
            obstacles.forEach(obstacle => {
                const distance = Math.abs(obstacle.position.z - player.position.z);
                const laneDistance = Math.abs(obstacle.position.x - player.position.x);

                if (distance < 0.6 && laneDistance < 1) {
                    if (obstacle.userData.type === 'puddle' && !isJumping) {
                        gameOver();
                    } else if (obstacle.userData.type !== 'puddle') {
                        if (isSliding && obstacle.position.y < 0.7) {
                            // Can slide under
                        } else if (isJumping && player.position.y > 1.5) {
                            // Can jump over
                        } else {
                            gameOver();
                        }
                    }
                }
            });

            cheeses.forEach((cheese, index) => {
                const distance = Math.abs(cheese.position.z - player.position.z);
                const laneDistance = Math.abs(cheese.position.x - player.position.x);

                if (distance < 0.5 && laneDistance < 1) {
                    scene.remove(cheese);
                    cheeses.splice(index, 1);
                    score += 1;
                    gameSpeed += 0.02;
                    playSound(800, 0.1);
                    updateScore();
                }
            });
        }

        function playSound(freq, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.value = 0.1;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function animate() {
            if (gameState !== 'playing') return;
            requestAnimationFrame(animate);

            // Move player to target lane
            const targetX = (playerLane - 1) * 3;
            player.position.x += (targetX - player.position.x) * 0.15;

            // Jumping physics
            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= 0.015;
                if (player.position.y <= 0.5) {
                    player.position.y = 0.5;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            // Move floor
            floorSegments.forEach(segment => {
                segment.position.z += 0.15 * gameSpeed;
                if (segment.position.z > 10) {
                    segment.position.z -= 60;
                }
            });

            // Move obstacles
            obstacles.forEach((obstacle, index) => {
                obstacle.position.z += 0.15 * gameSpeed;
                if (obstacle.position.z > 5) {
                    scene.remove(obstacle);
                    obstacles.splice(index, 1);
                }
            });

            // Move cheeses
            cheeses.forEach((cheese, index) => {
                cheese.position.z += 0.15 * gameSpeed;
                cheese.rotation.y += 0.05;
                if (cheese.position.z > 5) {
                    scene.remove(cheese);
                    cheeses.splice(index, 1);
                }
            });

            // Move cat
            cat.position.z += 0.08 * gameSpeed;
            if (cat.position.z > 4) {
                cat.position.z = 8;
            }
            cat.position.x += (player.position.x - cat.position.x) * 0.02;

            // Spawn obstacles
            obstacleSpawnTimer += gameSpeed;
            if (obstacleSpawnTimer > 60) {
                const lane = Math.floor(Math.random() * 3);
                createObstacle(lane, -20);
                obstacleSpawnTimer = 0;
            }

            // Spawn cheeses
            cheeseSpawnTimer += gameSpeed;
            if (cheeseSpawnTimer > 40) {
                const lane = Math.floor(Math.random() * 3);
                createCheese(lane, -15);
                cheeseSpawnTimer = 0;
            }

            checkCollision();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize game
        init();
        renderer.render(scene, camera);
    </script>
</body>
</html>
